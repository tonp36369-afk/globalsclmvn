<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCLM Global - Vòng Quay May Mắn</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #c94b8b 0%, #4568dc 100%);
            min-height: 100vh;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }
        
        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .code-box {
            background: rgba(139, 78, 147, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .code-box h2 {
            color: #FFD700;
            font-size: clamp(1.3rem, 4vw, 1.6rem);
            margin-bottom: 20px;
            text-align: center;
            text-transform: uppercase;
            font-weight: 900;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
        }
        
        .code-box input {
            flex: 1;
            padding: 14px 20px;
            font-size: clamp(1rem, 3vw, 1.2rem);
            border: 3px solid rgba(255,255,255,0.5);
            border-radius: 12px;
            background: rgba(255,255,255,0.95);
            color: #333;
            font-weight: bold;
            text-align: center;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        .code-box input::placeholder {
            color: rgba(51, 51, 51, 0.5);
            text-transform: none;
        }
        
        .submit-btn {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            border: none;
            padding: 14px 25px;
            font-size: clamp(1rem, 3vw, 1.2rem);
            font-weight: 900;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(59,130,246,0.4);
            white-space: nowrap;
        }
        
        .code-status {
            text-align: center;
            font-size: clamp(0.9rem, 2.5vw, 1rem);
            margin-top: 15px;
            font-weight: bold;
            min-height: 25px;
        }
        
        .error-message { color: #ff4444; }
        .success-message { color: #4CAF50; }
        
        .wheel-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1;
            margin: 20px auto;
        }
        
        .outer-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg,
                #FFD700 0deg 18deg, #FFA500 18deg 36deg,
                #FFD700 36deg 54deg, #FFA500 54deg 72deg,
                #FFD700 72deg 90deg, #FFA500 90deg 108deg,
                #FFD700 108deg 126deg, #FFA500 126deg 144deg,
                #FFD700 144deg 162deg, #FFA500 162deg 180deg,
                #FFD700 180deg 198deg, #FFA500 198deg 216deg,
                #FFD700 216deg 234deg, #FFA500 234deg 252deg,
                #FFD700 252deg 270deg, #FFA500 270deg 288deg,
                #FFD700 288deg 306deg, #FFA500 306deg 324deg,
                #FFD700 324deg 342deg, #FFA500 342deg 360deg
            );
            animation: rotate 6s linear infinite;
        }
        
        @keyframes rotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        
        #canvas {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 88%;
            height: 88%;
            border-radius: 50%;
            box-shadow: 0 0 0 6px #fff, 0 8px 30px rgba(0,0,0,0.5);
        }
        
        .arrow {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #FFD700;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
            z-index: 30;
        }
        
        .center-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: clamp(100px, 25vw, 130px);
            height: clamp(100px, 25vw, 130px);
            border-radius: 50%;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            border: 6px solid #fff;
            z-index: 25;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: clamp(1rem, 3vw, 1.4rem);
            font-weight: 900;
            color: #0a2e65;
            text-transform: uppercase;
            box-shadow: 0 0 0 2px #FFD700, 0 8px 20px rgba(0,0,0,0.4);
            transition: all 0.3s;
        }
        
        .center-button:not(.disabled):hover {
            transform: translate(-50%, -50%) scale(1.05);
        }
        
        .center-button.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: linear-gradient(135deg, #999 0%, #666 100%);
        }
        
        .prize-display {
            background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
            padding: clamp(25px, 5vw, 40px);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            display: none;
            border: 4px solid #FFD700;
            text-align: center;
        }
        
        .prize-display.show { display: block; }
        
        .prize-emoji {
            font-size: clamp(4rem, 12vw, 6rem);
            margin-bottom: 15px;
        }
        
        .prize-title {
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            color: #0a2e65;
            font-weight: 900;
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        
        .prize-desc {
            color: #475569;
            font-size: clamp(1rem, 3vw, 1.3rem);
            margin-bottom: 25px;
            font-weight: 600;
            white-space: pre-line;
        }
        
        .prize-button {
            background: linear-gradient(135deg, #0a2e65 0%, #154a9a 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 12px;
            font-size: clamp(1rem, 3vw, 1.2rem);
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="code-box">
            <h2>NHẬP MÃ THAM GIA</h2>
            <div class="input-group">
                <input type="text" id="codeInput" maxlength="9" placeholder="NHẬP MÃ CỦA BẠN..." oninput="this.value = this.value.toUpperCase()">
                <button class="submit-btn" onclick="validateCode()">XÁC NHẬN</button>
            </div>
            <div class="code-status" id="codeStatus"></div>
        </div>
        
        <div class="wheel-container">
            <div class="arrow"></div>
            <div class="outer-ring"></div>
            <canvas id="canvas" width="500" height="500"></canvas>
            <div class="center-button disabled" id="spinButton">START</div>
        </div>
        
        <div class="prize-display" id="prizeDisplay">
            <div class="prize-emoji" id="prizeEmoji">🎁</div>
            <div class="prize-title" id="prizeTitle">CHÚC MỪNG!</div>
            <div class="prize-desc" id="prizeDesc">Bạn đã trúng giải thưởng</div>
            <button class="prize-button" onclick="resetGame()">🎰 QUAY LẠI 🎰</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const spinButton = document.getElementById('spinButton');
        const prizeDisplay = document.getElementById('prizeDisplay');
        const codeInput = document.getElementById('codeInput');
        const codeStatus = document.getElementById('codeStatus');
        
        let currentCode = '';
        let targetPrizeIndex = -1;
        let isCodeValid = false;
        let currentRotation = 0;
        let isSpinning = false;
        
        const prizes = [
            { text: 'iPhone 17\nPro Max', emoji: '📱', title: 'IPHONE 17 PRO MAX', desc: 'iPhone 17 Pro Max mới nhất từ SCLM Global', color: '#FF6B6B' },
            { text: 'Nồi Cơm\nSharp', emoji: '🍚', title: 'NỒI CƠM ĐIỆN SHARP', desc: 'Nồi cơm điện Sharp cao cấp', color: '#4ECDC4' },
            { text: 'Tủ Lạnh', emoji: '❄️', title: 'TỦ LẠNH', desc: 'Tủ lạnh hiện đại từ SCLM', color: '#FFD93D' },
            { text: 'Xe SH\nMode', emoji: '🛵', title: 'XE MÁY SH MODE', desc: 'Xe máy Honda SH Mode mới 100%', color: '#95E1D3' },
            { text: '1 Cây\nVàng SCJ', emoji: '🏆', title: '1 CÂY VÀNG SCJ', desc: '1 cây vàng SCJ thật', color: '#F38181' },
            { text: '3 Chỉ\nVàng 999', emoji: '💍', title: '3 CHỈ VÀNG 999', desc: '3 chỉ vàng 999 thật', color: '#AA96DA' },
            { text: 'Nồi Cơm\nPanasonic', emoji: '🍚', title: 'NỒI CƠM ĐIỆN PANASONIC', desc: 'Nồi cơm điện Panasonic cao cấp', color: '#FCBAD3' },
            { text: 'Xe\nVision', emoji: '🛵', title: 'XE MÁY VISION', desc: 'Xe máy Honda Vision mới 100%', color: '#A8D8EA' },
            { text: 'Cặp Mũ\nBảo Hiểm', emoji: '🪖', title: 'CẶP MŨ BẢO HIỂM', desc: 'Cặp mũ bảo hiểm cao cấp', color: '#FFB6C1' },
            { text: 'Tiền\n200K', emoji: '💵', title: 'TIỀN MẶT 200K', desc: 'Tiền mặt 200.000đ', color: '#98D8C8' },
            { text: 'Tiền\n100K', emoji: '💵', title: 'TIỀN MẶT 100K', desc: 'Tiền mặt 100.000đ', color: '#F7DC6F' },
            { text: 'Chúc bạn\nmay mắn', emoji: '🍀', title: 'CHÚC BẠN MAY MẮN LẦN SAU', desc: 'Đừng bỏ cuộc, hãy thử lại!', color: '#BB8FCE' }
        ];
        
        function getHashFromCode(code) {
            let hash = 0;
            for (let i = 0; i < code.length; i++) {
                hash = ((hash << 5) - hash) + code.charCodeAt(i);
                hash = hash & hash;
            }
            return Math.abs(hash);
        }
        
        function validateCode() {
            const code = codeInput.value.trim().toUpperCase();
            if (code.length !== 9) {
                showMessage('❌ Mã phải có đúng 9 ký tự!', 'error');
                return;
            }
            if (!code.startsWith('SCLM')) {
                showMessage('❌ Mã phải bắt đầu bằng SCLM!', 'error');
                return;
            }
            const lastFive = code.substring(4);
            if (!/^[A-Z0-9]{5}$/.test(lastFive)) {
                showMessage('❌ 5 ký tự cuối phải là chữ hoặc số!', 'error');
                return;
            }
            currentCode = code;
            targetPrizeIndex = getHashFromCode(code) % prizes.length;
            isCodeValid = true;
            spinButton.classList.remove('disabled');
            showMessage('✅ Mã hợp lệ! Bấm START để quay!', 'success');
        }
        
        function showMessage(msg, type) {
            codeStatus.textContent = msg;
            codeStatus.className = 'code-status ' + (type === 'error' ? 'error-message' : 'success-message');
        }
        
        function drawWheel() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2;
            const sliceAngle = (2 * Math.PI) / prizes.length;
            
            prizes.forEach((prize, index) => {
                const startAngle = index * sliceAngle + currentRotation;
                const endAngle = startAngle + sliceAngle;
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.lineTo(centerX, centerY);
                ctx.fillStyle = prize.color;
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 4;
                ctx.stroke();
                
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 3;
                const lines = prize.text.split('\n');
                lines.forEach((line, i) => {
                    ctx.fillText(line, radius * 0.7, (i - (lines.length - 1) / 2) * 18);
                });
                ctx.restore();
            });
        }
        
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawWheel();
            requestAnimationFrame(animate);
        }
        
        function spin() {
            if (isSpinning || !isCodeValid) return;
            isSpinning = true;
            const spinDuration = 5000;
            const spinRotations = 7 + Math.random() * 3;
            const sliceAngle = (2 * Math.PI) / prizes.length;
            const targetAngle = targetPrizeIndex * sliceAngle + sliceAngle / 2;
            const finalRotation = (spinRotations * 2 * Math.PI) + (2 * Math.PI - targetAngle - Math.PI / 2);
            const startTime = Date.now();
            const startRotation = currentRotation;
            
            function animateSpin() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / spinDuration, 1);
                const easeProgress = 1 - Math.pow(1 - progress, 4);
                currentRotation = startRotation + finalRotation * easeProgress;
                
                if (progress < 1) {
                    requestAnimationFrame(animateSpin);
                } else {
                    setTimeout(() => {
                        showPrize(prizes[targetPrizeIndex]);
                        isSpinning = false;
                    }, 500);
                }
            }
            animateSpin();
        }
        
        function showPrize(prize) {
            document.getElementById('prizeEmoji').textContent = prize.emoji;
            document.getElementById('prizeTitle').textContent = prize.title;
            document.getElementById('prizeDesc').textContent = prize.desc + '\n🎫 Mã: ' + currentCode;
            prizeDisplay.classList.add('show');
        }
        
        function resetGame() {
            prizeDisplay.classList.remove('show');
            codeInput.value = '';
            currentCode = '';
            targetPrizeIndex = -1;
            isCodeValid = false;
            spinButton.classList.add('disabled');
            codeStatus.textContent = '';
            codeStatus.className = 'code-status';
        }
        
        spinButton.addEventListener('click', spin);
        codeInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') validateCode();
        });
        animate();
    </script>
</body>
</html>
